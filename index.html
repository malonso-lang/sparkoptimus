<style>
  /* -------------------------------------------------------
     New homepage utility classes.
     Only classes NOT already in site.css are defined here.
     All var(--*) names are from tokens.css.
  ------------------------------------------------------- */

  /* Footer-flash guard: holds footer below viewport while React/Babel loads.
     Once React mounts and renders into #app, :empty no longer applies. */
  #app:empty { min-height: 100vh; }

  /* Lucide <i> inline icon reset */
  i[data-lucide] { display: inline-block; line-height: 0; }

  /* Layout wrapper used by new sections */
  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 clamp(24px, 5vw, 48px);
  }

  /* Section surface variants — additive to .section from site.css */
  .section--dark {
    background: var(--so-ink-900);
    color: var(--fg-on-inverse);
  }
  .section--dark h1,
  .section--dark h2,
  .section--dark h3,
  .section--dark h4 { color: #fff; }
  .section--dark p   { color: var(--so-ink-200); }

  .section--light { background: var(--bg-canvas); }
  .section--paper { background: var(--bg-subtle); }

  /* Section title — used by WhatWeDo, Cases, Team */
  .sec-title {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2rem, 1.2rem + 2.2vw, 3rem);
    line-height: 1.06;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
    color: var(--fg-1);
  }

  /* Arrow link with Lucide icon — distinct from .arrowlink in site.css */
  .link-arrow {
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 15px;
    color: var(--so-cyan-700);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: color var(--duration-base) var(--ease-out);
  }
  .link-arrow svg { width: 17px; height: 17px; transition: transform var(--duration-base) var(--ease-out); }
  .link-arrow:hover { color: var(--so-cyan-600); }
  .link-arrow:hover svg { transform: translateX(4px); }
  .section--dark .link-arrow { color: var(--so-cyan-400); }

  /* Client logo reveal grid */
  .client-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(56px, 6vw, 88px) clamp(16px, 2vw, 36px);
    align-items: center;
    justify-items: center;
  }
  .client-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: calc(clamp(40px, 4vw, 54px) * var(--s, 1));
    opacity: 0;
    filter: blur(12px);
    transform: translateY(10px);
    transition:
      opacity  720ms var(--ease-out),
      filter   720ms var(--ease-out),
      transform720ms var(--ease-out);
    transition-delay: calc(var(--i) * 55ms);
  }
  .client-logo img {
    max-width: min(100%, 188px);
    max-height: 100%;
    width: auto;
    object-fit: contain;
    transition: transform 200ms var(--ease-out);
  }
  .client-grid.is-in .client-logo { opacity: 1; filter: blur(0); transform: none; }
  .client-logo:hover img { transform: scale(1.12); }

  @media (prefers-reduced-motion: reduce) {
    .client-logo { transition: none; opacity: 1; filter: none; transform: none; }
  }
  @media (max-width: 860px) {
    .client-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 32px 24px;
    }
    /* Uniform cell — every logo box is the same size; image adjusts inside */
    .client-logo {
      height: 56px !important;
      width: 100%;
    }
    .client-logo img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  }

  /* ── MOBILE-ONLY overrides (≤ 680px) ─────────────────────────── */
  @media (max-width: 680px) {

    /* 1. Service lists: split into 2 separate cards */
    .svc-block {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column;
      gap: 16px;
    }
    .svc-block .svc-list-grid > div:not(.svc-list-grid__divider) {
      background: rgb(244, 254, 255);
      border-radius: var(--radius-2xl);
      padding: clamp(24px, 5vw, 40px);
      border: 1px solid var(--border-1);
    }

    /* 2. Proof grid: 3×2 logo-only grid */
    .proof-grid {
      grid-template-columns: repeat(3, 1fr) !important;
    }
    .proof-grid__item {
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      padding: clamp(14px, 3vw, 22px) clamp(10px, 2vw, 16px) !important;
      gap: 0 !important;
      min-width: 0 !important;   /* prevent grid column blowout */
      overflow: hidden !important;
    }
    /* Uniform image container — same width as column, fixed height */
    .proof-grid__item > div:first-child {
      width: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .proof-grid__item > div:first-child img {
      height: 42px !important;   /* uniform height — overrides inline p.h */
      width: auto !important;
      max-width: 100% !important;
      object-fit: contain !important;
    }
    /* Hide title + subtitle text, keep only the logo img */
    .proof-grid__item > div:last-child { display: none !important; }
    /* Reset border rules for 3-col */
    .proof-grid__item:nth-child(n+4) {
      border-top: 1px solid rgba(255,255,255,0.10) !important;
    }
    .proof-grid__item:nth-child(3n+1) { border-left: none !important; }
    .proof-grid__item:nth-child(3n+2),
    .proof-grid__item:nth-child(3n+3) {
      border-left: 1px solid rgba(255,255,255,0.10) !important;
    }
    .proof-grid__item:nth-child(1),
    .proof-grid__item:nth-child(2),
    .proof-grid__item:nth-child(3) { border-top: none !important; }
  }

  /* 3. Team grid: 2×2 on mobile */
  @media (max-width: 480px) {
    .team-grid {
      grid-template-columns: repeat(2, 1fr) !important;
    }
  }
</style>
