  /* ============================================================
     BLOG — Modern grid layout with featured articles
     ============================================================ */

  /* Override default section spacing for blog flow */
  body[data-page="blog"] .section {
    padding-block: 24px;
  }

  /* ---------- HERO ---------- */
  .blog-hero {
    padding-top: clamp(120px, 12vw, 160px);
    padding-bottom: clamp(60px, 6vw, 80px);
    background: linear-gradient(180deg, rgba(6,11,26,0.95) 0%, rgba(6,11,26,0.85) 100%), url('site/assets/insights-featured-bg.jpg') center/cover no-repeat;
    color: #fff;
  }

  .blog-hero h1 {
    font-size: clamp(2.4rem, 1.3rem + 3.6vw, 4.2rem);
    font-family: var(--font-display);
    font-weight: 800;
    margin: 0;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: #fff;
  }

  .blog-hero h1 em {
    font-style: normal;
    color: var(--so-cyan-500);
  }

  /* ---------- FILTER BAR ---------- */
  .blog-filters {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 16px 0;
    flex-wrap: wrap;
  }

  .blog-filters__label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-3);
  }

  .blog-filters__tags {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .blog-tag {
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border-1);
    background: var(--so-gray-0);
    color: var(--fg-2);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--duration-base) var(--ease-out);
    text-decoration: none;
    display: inline-block;
  }

  .blog-tag:hover {
    border-color: var(--so-cyan-500);
    color: var(--so-cyan-700);
    box-shadow: var(--shadow-sm);
  }

  .blog-tag.is-active {
    background: var(--so-cyan-600);
    color: #fff;
    border-color: var(--so-cyan-600);
  }

  /* ---------- FEATURED ARTICLE (mirrors ep-feat from CEO Stories) ---------- */
  .blog-featured {
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    border-radius: var(--radius-2xl);
    overflow: hidden;
    box-shadow: var(--shadow-md);
    background: var(--so-gray-0);
    margin-bottom: 56px;
    text-decoration: none;
    color: inherit;
  }

  .blog-featured:hover { box-shadow: var(--shadow-lg); }

  .blog-featured__media {
    position: relative;
    background: var(--so-ink-900);
    overflow: hidden;
    min-height: 380px;
  }

  .blog-featured__media image-slot {
    width: 100%;
    height: 100%;
    --img-radius: 0;
  }

  .blog-featured__text {
    padding: clamp(28px, 3.5vw, 48px);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .blog-featured h2 {
    font-size: clamp(1.3rem, 1rem + 1.1vw, 1.85rem);
    margin: 0 0 12px;
  }

  .blog-featured__who {
    font-size: 13px;
    color: var(--fg-3);
    margin-bottom: 4px;
  }

  .blog-featured__date {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-3);
    margin-top: 6px;
  }

  .blog-featured__btn {
    margin-top: 28px;
    align-self: flex-start;
  }

  /* ---------- ARTICLES GRID ---------- */
  .blog-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(24px, 3vw, 32px);
    margin-bottom: 16px;
  }

  .blog-card {
    display: flex;
    flex-direction: column;
    border-radius: var(--radius-xl);
    overflow: hidden;
    background: var(--so-gray-0);
    box-shadow: var(--shadow-sm);
    transition: all var(--duration-base) var(--ease-out);
    text-decoration: none;
    color: inherit;
  }

  .blog-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
  }

  .blog-card__media {
    aspect-ratio: 16 / 10;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--so-cyan-700), var(--so-ink-700));
  }

  .blog-card__media image-slot {
    width: 100%;
    height: 100%;
    --img-radius: 0;
  }

  .blog-card__body {
    padding: clamp(22px, 2vw, 28px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .blog-card__tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--so-cyan-600);
    margin-bottom: 8px;
  }

  .blog-card h3 {
    font-size: clamp(1.1rem, 0.95rem + 0.8vw, 1.4rem);
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--fg-1);
    margin: 0;
    line-height: 1.3;
    letter-spacing: -0.01em;
  }

  .blog-card__excerpt {
    font-size: 14px;
    color: var(--fg-2);
    line-height: 1.5;
    margin: 8px 0 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .blog-card__footer {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--border-1);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--fg-3);
  }

  .blog-card__author {
    font-weight: 600;
    color: var(--fg-2);
  }

  .blog-card__avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--so-cyan-500);
    color: var(--so-ink-900);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 12px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .blog-card__author-wrap {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .blog-card__date {
    font-size: 11px;
  }

  /* ---------- LOAD MORE ---------- */
  .blog-cta {
    display: flex;
    justify-content: center;
    align-items: center;
    padding-block: 16px;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 900px) {
    .blog-featured { grid-template-columns: 1fr; }
    /* aspect-ratio ensures image panel fills correctly when stacked in 1-col layout */
    .blog-featured__media { aspect-ratio: 16 / 9; min-height: 0; }
    .blog-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .blog-filters { gap: 12px; }
    .blog-grid { grid-template-columns: 1fr; }
    .blog-featured__text { padding: 24px; }
  }
</style>

<body data-page="impact">

<main>

<script>
  (function () {
    /* ---- Blog articles data ---- */
    var ARTICLES = window.SO_POSTS;

    /* ---- Initials helper ---- */
    function initials(name) {
      return name.split(" ").filter(Boolean).slice(0, 2).map(function(w){ return w[0].toUpperCase(); }).join("");
    }

    /* ---- Extract unique tags ---- */
    var tags = ["All"];
    ARTICLES.forEach(function (a) {
      if (tags.indexOf(a.tag) === -1) tags.push(a.tag);
    });

    var currentFilter = "All";
    var articlesPerPage = 12;
    var currentPage = 1;

    /* ---- Render filter tags ---- */
    function renderFilters() {
      var html = tags.map(function (tag) {
        var active = tag === currentFilter ? " is-active" : "";
        return '<button class="blog-tag' + active + '" data-tag="' + tag + '">' + tag + '</button>';
      }).join("");
      document.getElementById("filterTags").innerHTML = html;

      document.querySelectorAll(".blog-tag").forEach(function (btn) {
        btn.addEventListener("click", function () {
          currentFilter = btn.getAttribute("data-tag");
          currentPage = 1;
          renderFilters();
          renderArticles();
        });
      });
    }

    /* ---- Filter articles ---- */
    function getFilteredArticles() {
      if (currentFilter === "All") return ARTICLES;
      return ARTICLES.filter(function (a) { return a.tag === currentFilter; });
    }


    /* ---- Render articles grid ---- */
    function renderArticles() {
      var filtered = getFilteredArticles();
      var start = (currentPage - 1) * articlesPerPage;
      var end = start + articlesPerPage;
      var page = filtered.slice(start, end);

      var html = page.map(function (a) {
        return '<a class="blog-card reveal" href="' + SO_PL('blog', a.id) + '">' +
          '<div class="blog-card__media"><image-slot shape="rect" placeholder="Article image" src="' + a.image + '"></image-slot></div>' +
          '<div class="blog-card__body">' +
            '<span class="blog-card__tag">' + a.tag + '</span>' +
            '<h3>' + a.title + '</h3>' +
            '<p class="blog-card__excerpt">' + a.excerpt + '</p>' +
            '<div class="blog-card__footer">' +
              '<div class="blog-card__author-wrap">' +
                '<div class="blog-card__avatar">' + initials(a.author) + '</div>' +
                '<span class="blog-card__author">' + a.author + '</span>' +
              '</div>' +
              '<span class="blog-card__date">' + a.date + '</span>' +
            '</div>' +
          '</div>' +
        '</a>';
      }).join("");

      var grid = document.getElementById("blogGrid");
      if (currentPage === 1) {
        grid.innerHTML = html;
      } else {
        grid.innerHTML += html;
      }

      /* Re-attach reveal observer */
      window.SO.reveal();

      /* Update load more button */
      var hasMore = end < filtered.length;
      var btn = document.getElementById("loadMoreBtn");
      if (hasMore) {
        btn.style.display = "block";
        btn.textContent = "Load more articles";
      } else {
        btn.style.display = end > articlesPerPage ? "block" : "none";
        if (end > articlesPerPage) btn.textContent = "No more articles";
      }
    }

    /* ---- Load more handler ---- */
    var loadMoreBtn = document.getElementById("loadMoreBtn");
    if (loadMoreBtn) {
      loadMoreBtn.addEventListener("click", function () {
        currentPage++;
        renderArticles();
      });
    }

    /* ---- Init ---- */
    renderFilters();
    renderArticles();

    window.SO.reveal();
  })();
</script>
