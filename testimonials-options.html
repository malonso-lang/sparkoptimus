<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testimonials — Options<span class="metadot" aria-hidden="true"></span>SparkOptimus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cyan: #00D9F4; --cyan-50: #f0fdff; --cyan-100: #d4f8fd; --cyan-400: #22d3ee;
    --cyan-500: #00D9F4; --cyan-700: #0e7490; --cyan-900: #0c3a4a;
    --ink: #0E172A; --ink-50: #f5f6f8; --ink-100: #eaecf0; --ink-200: #d0d5de;
    --ink-300: #8f98ab; --ink-400: #6b7589; --ink-600: #2d3a52; --ink-800: #111827; --ink-900: #060B1A;
    --gray-0: #fff; --gray-50: #fafafa;
    --border: rgba(14,23,42,0.08);
    --shadow-sm: 0 2px 8px rgba(14,23,42,0.06);
    --shadow-md: 0 8px 28px rgba(14,23,42,0.09);
    --shadow-lg: 0 18px 48px rgba(14,23,42,0.13);
    --r-xl: 20px; --r-2xl: 28px; --r-pill: 999px;
    --ease-out: cubic-bezier(0.22,1,0.36,1);
    --font: 'Manrope', sans-serif;
    --serif: 'Lora', serif;
  }
  body { font-family: var(--font); background: #f0f0f0; color: var(--ink); }
  .canvas-wrap { padding: 48px 40px 80px; }
  .canvas-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: #888; margin-bottom: 36px; display: flex; align-items: center; gap: 10px; }
  .canvas-label::after { content:''; flex: 1; height: 1px; background: #ddd; }
  .section-title { font-size: 13px; font-weight: 700; color: #555; letter-spacing: .06em; text-transform: uppercase;
    margin-bottom: 24px; padding-bottom: 10px; border-bottom: 1px solid #ddd; }
  .options-row { display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start; }
  .option-frame {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    overflow: hidden;
    flex: 1;
    min-width: 420px;
  }
  .option-label {
    background: #f7f7f7;
    border-bottom: 1px solid #e8e8e8;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .option-label strong { font-size: 13px; font-weight: 700; color: #222; }
  .option-label span { font-size: 12px; color: #888; }
  .option-body { padding: 0; }
.metadot{display:inline-block;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.45;vertical-align:middle;margin:0 10px}
</style>
  <meta name="description" content="What our people say about working at SparkOptimus.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Employee testimonials — SparkOptimus">
  <meta property="og:description" content="What our people say about working at SparkOptimus.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="site/assets/team-hero-bg.jpg">
  <meta property="og:site_name" content="SparkOptimus">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Employee testimonials — SparkOptimus">
  <meta name="twitter:description" content="What our people say about working at SparkOptimus.">
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const PEOPLE = [
  {
    init: 'SV', name: 'Sarah van den Berg', role: 'Digital Strategy Consultant', tenure: '2 years',
    short: 'Ownership from day one — leading client workstreams at a major European retailer by month three.',
    quote: 'What surprised me most was the ownership I got from day one. By month three I was leading client workstreams at one of Europe\'s largest retailers. The learning curve is steep — and that\'s exactly what you want.'
  },
  {
    init: 'MG', name: 'Martijn de Groot', role: 'Manager Data & AI', tenure: '4 years',
    short: 'Rigorous strategy work combined with the ambition to actually build and implement.',
    quote: 'SparkOptimus sits at a rare intersection: genuinely rigorous strategy work, combined with the ambition to actually build and implement. You don\'t just hand over a report — you stay until it works.'
  },
  {
    init: 'EK', name: 'Emma Konings', role: 'Associate', tenure: '1 year',
    short: 'Direct, collaborative people genuinely invested in each other\'s growth.',
    quote: 'I joined straight from my Master\'s and the culture here is unlike anything I expected from a consultancy. People are direct, collaborative, and genuinely invested in each other\'s growth.'
  },
  {
    init: 'RB', name: 'Roos Bakker', role: 'Senior Consultant', tenure: '3 years',
    short: 'Real C-level exposure within weeks, and a team that backs you every step of the way.',
    quote: 'You get real C-level exposure within weeks. It\'s demanding — but you have a team that backs you at every step, and the quality of thinking around you pushes you to be better constantly.'
  },
];

/* ─── OPTION A: Fullscreen Carousel ─────────────────────────── */
function OptionCarousel() {
  const [idx, setIdx] = useState(0);
  const [anim, setAnim] = useState('in');
  const timer = useRef(null);

  function go(next) {
    setAnim('out');
    setTimeout(() => {
      setIdx((next + PEOPLE.length) % PEOPLE.length);
      setAnim('in');
    }, 220);
  }

  useEffect(() => {
    timer.current = setInterval(() => go(idx + 1), 5000);
    return () => clearInterval(timer.current);
  }, [idx]);

  function manualGo(n) { clearInterval(timer.current); go(n); }

  const p = PEOPLE[idx];
  return (
    <div style={{ background: 'var(--ink-900)', padding: '48px 44px', position: 'relative', overflow: 'hidden', minHeight: 320 }}>
      {/* cyan orb */}
      <div style={{ position:'absolute', width:340, height:340, borderRadius:'50%',
        background:'radial-gradient(circle, rgba(0,217,244,0.12) 0%, transparent 70%)',
        top:-80, right:-60, pointerEvents:'none' }} />
      <div style={{
        opacity: anim === 'in' ? 1 : 0,
        transform: anim === 'in' ? 'translateY(0)' : 'translateY(10px)',
        transition: 'opacity 0.22s ease, transform 0.22s ease',
      }}>
        <p style={{ fontFamily:'var(--serif)', fontStyle:'italic', fontSize:19, lineHeight:1.65,
          color:'rgba(255,255,255,0.92)', marginBottom:28, maxWidth:560 }}>
          "{p.quote}"
        </p>
        <div style={{ display:'flex', alignItems:'center', gap:14 }}>
          <div style={{ width:44, height:44, borderRadius:'50%', background:'var(--cyan-900)',
            border:'2px solid var(--cyan-500)', color:'var(--cyan-400)', fontWeight:700, fontSize:13,
            display:'grid', placeItems:'center', flexShrink:0 }}>{p.init}</div>
          <div>
            <div style={{ color:'#fff', fontWeight:700, fontSize:15 }}>{p.name}</div>
            <div style={{ color:'rgba(255,255,255,0.45)', fontSize:13 }}>{p.role}<i class=metadot></i>{p.tenure}</div>
          </div>
        </div>
      </div>
      {/* controls */}
      <div style={{ display:'flex', alignItems:'center', gap:10, marginTop:32 }}>
        <button onClick={() => manualGo(idx - 1)} style={{ width:38, height:38, borderRadius:'50%',
          border:'1px solid rgba(255,255,255,0.18)', background:'rgba(255,255,255,0.04)',
          color:'#fff', cursor:'pointer', display:'grid', placeItems:'center' }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button onClick={() => manualGo(idx + 1)} style={{ width:38, height:38, borderRadius:'50%',
          border:'1px solid rgba(255,255,255,0.18)', background:'rgba(255,255,255,0.04)',
          color:'#fff', cursor:'pointer', display:'grid', placeItems:'center' }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div style={{ display:'flex', gap:6, marginLeft:'auto' }}>
          {PEOPLE.map((_, i) => (
            <button key={i} onClick={() => manualGo(i)} style={{
              width: i === idx ? 22 : 7, height:7, borderRadius:99, border:'none', cursor:'pointer',
              background: i === idx ? 'var(--cyan-500)' : 'rgba(255,255,255,0.22)',
              transition:'width 0.3s var(--ease-out), background 0.3s ease', padding:0
            }} />
          ))}
        </div>
      </div>
    </div>
  );
}

/* ─── OPTION B: Person Selector ─────────────────────────────── */
function OptionPersonSelector() {
  const [sel, setSel] = useState(0);
  const p = PEOPLE[sel];
  return (
    <div style={{ display:'grid', gridTemplateColumns:'200px 1fr', minHeight:260 }}>
      {/* sidebar */}
      <div style={{ background:'var(--ink-50)', borderRight:'1px solid var(--border)', padding:'16px 0' }}>
        {PEOPLE.map((person, i) => (
          <button key={i} onClick={() => setSel(i)} style={{
            display:'flex', alignItems:'center', gap:11, padding:'14px 18px', width:'100%',
            border:'none', background: i===sel ? '#fff' : 'transparent', cursor:'pointer',
            borderRight: i===sel ? '2px solid var(--cyan-500)' : '2px solid transparent',
            transition:'background 0.15s ease', textAlign:'left'
          }}>
            <div style={{ width:34, height:34, borderRadius:'50%', flexShrink:0,
              background: i===sel ? 'var(--cyan-500)' : 'var(--ink-200)',
              color: i===sel ? 'var(--ink-900)' : 'var(--ink-400)',
              fontWeight:700, fontSize:11, display:'grid', placeItems:'center',
              transition:'background 0.15s, color 0.15s' }}>{person.init}</div>
            <div style={{ minWidth:0 }}>
              <div style={{ fontSize:12.5, fontWeight:700, color: i===sel ? 'var(--ink)' : 'var(--ink-400)',
                whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{person.name.split(' ')[0]}</div>
              <div style={{ fontSize:11, color:'var(--ink-300)', marginTop:1,
                whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{person.role.split(' ').slice(0,2).join(' ')}</div>
            </div>
          </button>
        ))}
      </div>
      {/* content */}
      <div style={{ padding:'32px 28px', display:'flex', flexDirection:'column', justifyContent:'center' }}>
        <span style={{ fontFamily:'var(--serif)', fontSize:52, lineHeight:0.5, color:'var(--cyan-500)',
          display:'block', marginBottom:16 }}>"</span>
        <p style={{ fontFamily:'var(--serif)', fontStyle:'italic', fontSize:16, lineHeight:1.7,
          color:'var(--ink)', marginBottom:24 }}>{p.quote}</p>
        <div style={{ display:'flex', alignItems:'center', gap:12, paddingTop:18,
          borderTop:'1px solid var(--border)' }}>
          <div style={{ width:40, height:40, borderRadius:'50%', background:'var(--cyan-500)',
            color:'var(--ink-900)', fontWeight:700, fontSize:12, display:'grid', placeItems:'center' }}>{p.init}</div>
          <div>
            <div style={{ fontWeight:700, fontSize:14, color:'var(--ink)' }}>{p.name}</div>
            <div style={{ fontSize:12, color:'var(--ink-300)', marginTop:2 }}>{p.role}<i class=metadot></i>{p.tenure}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── OPTION C: Scrolling Tape ───────────────────────────────── */
function OptionScrollTape() {
  return (
    <div style={{ padding:'28px 0', background:'var(--gray-0)', overflow:'hidden' }}>
      <style>{`
        @keyframes tapeScroll { from { transform:translateX(0) } to { transform:translateX(-50%) } }
        .tape-track { display:flex; gap:20px; animation: tapeScroll 28s linear infinite; will-change:transform; width:max-content; }
        .tape-track:hover { animation-play-state:paused; }
        .tape-card { background:var(--cyan-50); border:1px solid var(--cyan-100); border-radius:16px;
          padding:22px 26px; width:320px; flex-shrink:0; cursor:default; transition:box-shadow .2s ease, transform .2s ease; }
        .tape-card:hover { box-shadow:var(--shadow-md); transform:translateY(-2px); }
      `}</style>
      <div style={{ paddingLeft:32, marginBottom:20 }}>
        <div style={{ fontSize:12, fontWeight:700, letterSpacing:'.08em', textTransform:'uppercase',
          color:'var(--ink-300)' }}>What our team says</div>
      </div>
      <div className="tape-track">
        {[...PEOPLE,...PEOPLE].map((p, i) => (
          <div key={i} className="tape-card">
            <p style={{ fontFamily:'var(--serif)', fontStyle:'italic', fontSize:14, lineHeight:1.65,
              color:'var(--ink)', marginBottom:16 }}>"{p.short}"</p>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <div style={{ width:32, height:32, borderRadius:'50%', background:'var(--cyan-500)',
                color:'var(--ink-900)', fontWeight:700, fontSize:11, display:'grid', placeItems:'center',
                flexShrink:0 }}>{p.init}</div>
              <div>
                <div style={{ fontWeight:700, fontSize:13, color:'var(--ink)' }}>{p.name}</div>
                <div style={{ fontSize:11.5, color:'var(--ink-300)' }}>{p.role}</div>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── OPTION D: Stacked Spotlight ────────────────────────────── */
function OptionStackedSpotlight() {
  const [open, setOpen] = useState(null);
  return (
    <div style={{ padding:'8px 0' }}>
      {PEOPLE.map((p, i) => {
        const isOpen = open === i;
        return (
          <div key={i} style={{ borderBottom:'1px solid var(--border)' }}>
            <button
              onClick={() => setOpen(isOpen ? null : i)}
              style={{ display:'flex', alignItems:'center', gap:14, padding:'18px 28px',
                width:'100%', border:'none', background: isOpen ? 'var(--cyan-50)' : 'transparent',
                cursor:'pointer', textAlign:'left', transition:'background .15s ease' }}
            >
              <div style={{ width:40, height:40, borderRadius:'50%', flexShrink:0,
                background: isOpen ? 'var(--cyan-500)' : 'var(--ink-100)',
                color: isOpen ? 'var(--ink-900)' : 'var(--ink-400)',
                fontWeight:700, fontSize:12, display:'grid', placeItems:'center',
                transition:'background .2s, color .2s' }}>{p.init}</div>
              <div style={{ flex:1 }}>
                <div style={{ fontWeight:700, fontSize:14.5, color:'var(--ink)' }}>{p.name}</div>
                <div style={{ fontSize:12.5, color:'var(--ink-300)', marginTop:2 }}>{p.role}<i class=metadot></i>{p.tenure}</div>
              </div>
              <div style={{ color: isOpen ? 'var(--cyan-500)' : 'var(--ink-300)',
                transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)', transition:'transform .25s var(--ease-out), color .2s' }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="m6 9 6 6 6-6"/>
                </svg>
              </div>
            </button>
            <div style={{
              maxHeight: isOpen ? 280 : 0, overflow:'hidden',
              transition:'max-height 0.42s cubic-bezier(0.22,1,0.36,1)',
            }}>
              <div style={{ padding:'4px 28px 26px 82px' }}>
                <p style={{ fontFamily:'var(--serif)', fontStyle:'italic', fontSize:15, lineHeight:1.7,
                  color:'var(--ink)', borderLeft:'2px solid var(--cyan-500)', paddingLeft:18, margin:0 }}>
                  "{p.quote}"
                </p>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ─── ROOT ───────────────────────────────────────────────────── */
function App() {
  return (
    <div className="canvas-wrap">
      <div className="canvas-label">Testimonials — interaction options<i class=metadot></i>SparkOptimus careers</div>

      {/* Row 1 */}
      <div className="section-title" style={{marginBottom:20}}>Option A — Full-bleed carousel</div>
      <div style={{ marginBottom:12, color:'#666', fontSize:13, lineHeight:1.6, maxWidth:620, marginBottom:24 }}>
        One quote fills the dark panel. Auto-advances; user can step or dot-navigate. 
        <strong style={{color:'#333'}}> Best for: </strong>drama, impact, dark sections. No reading fatigue.
      </div>
      <div className="options-row" style={{marginBottom:48}}>
        <div className="option-frame" style={{flex:'0 1 680px'}}>
          <div className="option-label"><strong>A<i class=metadot></i>Carousel</strong><span>Click arrows or wait 5s</span></div>
          <div className="option-body"><OptionCarousel /></div>
        </div>
      </div>

      {/* Row 2 */}
      <div className="section-title" style={{marginBottom:20}}>Option B — Person selector</div>
      <div style={{ marginBottom:24, color:'#666', fontSize:13, lineHeight:1.6, maxWidth:620 }}>
        Avatars on the left; clicking switches the quote panel. Immediately scannable — you see all names at once.
        <strong style={{color:'#333'}}> Best for: </strong>showcasing a specific team mix (seniority, role variety).
      </div>
      <div className="options-row" style={{marginBottom:48}}>
        <div className="option-frame" style={{flex:'0 1 680px'}}>
          <div className="option-label"><strong>B<i class=metadot></i>Person selector</strong><span>Click a name</span></div>
          <div className="option-body"><OptionPersonSelector /></div>
        </div>
      </div>

      {/* Row 3 */}
      <div className="section-title" style={{marginBottom:20}}>Option C — Auto-scroll tape</div>
      <div style={{ marginBottom:24, color:'#666', fontSize:13, lineHeight:1.6, maxWidth:620 }}>
        Cards scroll continuously like the photobar above it. No click needed — it just runs.
        <strong style={{color:'#333'}}> Best for: </strong>passive browsing, lighter visual weight. Hover to pause.
      </div>
      <div className="options-row" style={{marginBottom:48}}>
        <div className="option-frame" style={{flex:'0 1 820px'}}>
          <div className="option-label"><strong>C<i class=metadot></i>Scrolling tape</strong><span>Hover to pause</span></div>
          <div className="option-body"><OptionScrollTape /></div>
        </div>
      </div>

      {/* Row 4 */}
      <div className="section-title" style={{marginBottom:20}}>Option D — Stacked reveal</div>
      <div style={{ marginBottom:24, color:'#666', fontSize:13, lineHeight:1.6, maxWidth:620 }}>
        A clean list of people; clicking one expands their quote inline — <em>without</em> hiding the others.
        <strong style={{color:'#333'}}> Best for: </strong>reading multiple quotes, minimal space usage. 
        This is the "klapuit" done right: you tap a person, not a section header.
      </div>
      <div className="options-row" style={{marginBottom:48}}>
        <div className="option-frame" style={{flex:'0 1 680px'}}>
          <div className="option-label"><strong>D<i class=metadot></i>Stacked reveal</strong><span>Click a person to expand</span></div>
          <div className="option-body"><OptionStackedSpotlight /></div>
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
  <script defer src="site/scripts/search-index.js"></script>
</body>
</html>
